oss:
    title: Contribuciones OSS
    intro: >
      Aquí tienes una lista de algunas contribuciones a proyectos de código abierto (OSS) y proyectos personales open-source:
    contributions:
      - title: plocate Search for LibreELEC/Kodi
        link: https://github.com/plinkr/tools.plocate.search
        tagline: |
          Un complemento eficiente de búsqueda offline para LibreELEC/Kodi, que utiliza `plocate` para realizar búsquedas rápidas de archivos con una interfaz intuitiva dentro de Kodi.

      - title: NautaPy
        link: https://github.com/plinkr/nautapy
        tagline: |
          API en Python para el portal cautivo Nauta de Cuba, junto a una herramienta de línea de comandos (CLI).

      - title: Training Timer
        link: https://github.com/plinkr/training_timer
        tagline: |
          Temporizador para entrenamientos por intervalos (MMA, Boxeo, Kickboxing), desarrollado en Flutter.
          Puede ejecutarse de forma nativa en Linux y en la web en
          <a href="https://plinkr.github.io/training_timer_web/" target="_blank">https://plinkr.github.io/training_timer_web/</a>

      - title: dartfmt plugin for micro
        link: https://github.com/plinkr/micro-dartfmt
        tagline: |
          Plugin para el editor micro que añade soporte para el lenguaje Dart, incluyendo formateo y análisis de código mediante `dart format` y `dart analyze`.

      - title: FNM Cuba
        link: https://github.com/plinkr/fnm_cuba
        tagline: |
          Formulario Nacional de Medicamentos de Cuba, desarrollado con Flutter.
          Puede ejecutarse de forma nativa en las plataformas soportadas por Flutter y en la web en
          <a href="https://plinkr.github.io/fnm/" target="_blank">https://plinkr.github.io/fnm/</a>

