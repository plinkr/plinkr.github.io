career-profile:
    title: Perfil de carrera
    summary: |
      Ingeniero de Software con amplia experiencia en Java/Spring, Python, Flutter y SQL, y un 
      sólido dominio del desarrollo Full Stack y DevOps. Me destaco en tareas complejas de backend, 
      desde la gestión de bases de datos hasta diseño de APIs, con un enfoque en la creación de 
      sistemas fiables y eficientes. Con más de 10 años de experiencia, soy un colaborador en equipo, 
      conocido por mi naturaleza trabajadora, habilidades para resolver problemas y gran atención 
      al detalle. Aunque mi especialidad es el desarrollo backend, también soy capaz de contribuir 
      en el desarrollo frontend y de aplicaciones móviles cuando es necesario. 
      Me apasiona el Open Source y disfruto colaborando con equipos.
